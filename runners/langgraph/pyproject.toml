[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-lab-langgraph-runner"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agent-framework-field-lab",
  "deepagents>=0.7,<1",
  "langchain>=1.3,<2",
  "langchain-mcp-adapters>=0.3,<1",
  "langchain-openai>=1.4,<2",
  "langgraph>=1.2,<2",
  "mcp>=1.24,<2",
  "openinference-instrumentation-langchain>=0.1.68,<1",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
]

[dependency-groups]
checkpoint-production = [
  "langchain-azure-cosmosdb==1.0.0",
]

[tool.uv]
exclude-newer = "72 hours"

[tool.uv.sources]
agent-framework-field-lab = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_runner"]

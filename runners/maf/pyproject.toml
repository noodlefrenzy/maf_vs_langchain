[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-lab-maf-runner"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agent-framework-field-lab",
  "agent-framework-core>=1.12,<2",
  "agent-framework-openai>=1.11,<2",
  "agent-framework-orchestrations>=1.0,<2",
  "agent-framework-tools==1.0.0b260721",
  "mcp>=1.24,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
]

[tool.uv.sources]
agent-framework-field-lab = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/maf_runner"]

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-quarantine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.12"
      - name: Verify 72-hour dependency quarantine before installation
        run: python scripts/dependency_quarantine.py verify

  core:
    needs: dependency-quarantine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked core environment
        run: uv sync --locked
      - name: Install locked subprocess test environments
        run: |
          uv sync --project runners/maf --locked
          uv sync --project runners/langgraph --locked
          uv sync --project services/incident_mcp --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test
        run: |
          uv run pytest \
            --cov=agent_lab \
            --cov=incident_lab_mcp \
            --cov-report=term-missing \
            --ignore tests/test_model_compatibility.py \
            --ignore tests/test_framework_restart.py
      - name: Plan every experiment and validate every model profile
        run: |
          for profile in configs/experiments/*.toml; do
            uv run agent-lab experiment plan --experiment "$profile" > /dev/null
          done
          for profile in configs/models/*.toml; do
            uv run agent-lab config validate "$profile"
          done
      - name: Validate isolated project locks
        run: |
          uv lock --check --project runners/maf
          uv lock --check --project runners/langgraph
          uv lock --check --project services/incident_mcp

  isolated-api-smoke:
    needs: dependency-quarantine
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: runners/maf
            module: maf_runner.compat
          - project: runners/langgraph
            module: langgraph_runner.compat
          - project: services/incident_mcp
            module: incident_lab_mcp.compat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install isolated locked environment
        run: uv sync --project "${{ matrix.project }}" --locked
      - name: Verify current API surface
        run: uv run --project "${{ matrix.project }}" python -m "${{ matrix.module }}"

  native-integration:
    needs: dependency-quarantine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked core environment
        run: uv sync --locked
      - name: Install locked native client environments
        run: |
          uv sync --project runners/maf --locked
          uv sync --project runners/langgraph --locked
          uv sync --project services/incident_mcp --locked
      - name: Run native integration gates
        run: |
          uv run pytest \
            tests/test_model_compatibility.py \
            tests/test_framework_restart.py

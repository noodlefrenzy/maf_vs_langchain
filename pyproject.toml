[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-framework-field-lab"
version = "0.1.0"
description = "Framework-neutral experiment harness for comparing Microsoft Agent Framework and the LangChain stack."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.13,<3",
  "rich>=14.2,<15",
  "typer>=0.27,<1",
]

[project.scripts]
agent-lab = "agent_lab.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
  "ruff>=0.14,<1",
]
observer = [
  "fastapi>=0.141.1,<1",
  "uvicorn>=0.47,<1",
]

[tool.uv]
default-groups = ["dev", "observer"]
exclude-newer = "72 hours"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["services/incident_mcp/src"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 55
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

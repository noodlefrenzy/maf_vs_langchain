<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" fill="#172033" role="img" aria-labelledby="title desc">
  <title id="title">LangChain, LangGraph, and Deep Agents stack in the experiment</title>
  <desc id="desc">A LangChain chat model and integration layer sit above LangGraph. LangGraph supports an opinionated Deep Agents path and a custom explicit graph path. Both use MCP adapters and are observed through events plus OpenInference.</desc>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15916f"/><stop offset="1" stop-color="#0c6d53"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f8f3"/><stop offset="1" stop-color="#d8f0e7"/></linearGradient>
    <linearGradient id="graph" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf3fb"/><stop offset="1" stop-color="#dceaf7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17344d" flood-opacity="0.14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63798d"/></marker>
    <style>
      .label { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 21px; font-weight: 700; }
      .body { font-size: 15px; font-weight: 600; }
      .small { font-size: 13px; fill: #637285; }
      .micro { font-size: 11px; font-weight: 700; letter-spacing: .7px; }
      .edge { fill: none; stroke: #63798d; stroke-width: 2.3; marker-end: url(#arrow); }
      .card { fill: #fff; stroke: #c6d5e2; stroke-width: 1.5; filter: url(#shadow); }
    </style>
  </defs>

  <rect x="70" y="18" width="340" height="64" rx="19" class="card"/>
  <circle cx="109" cy="50" r="18" fill="#7755a6"/>
  <path d="M99 50c6-11 14-11 20 0-6 11-14 11-20 0Z" fill="none" stroke="#fff" stroke-width="1.9"/>
  <text x="140" y="46" class="label title">LangChain chat model</text>
  <text x="140" y="66" class="label small">local OpenAI-compatible endpoint</text>
  <path d="M410 50H452" class="edge"/>

  <rect x="455" y="18" width="306" height="64" rx="19" class="card"/>
  <circle cx="494" cy="50" r="18" fill="#15916f"/>
  <path d="M484 50h20M494 40v20" stroke="#fff" stroke-width="2"/>
  <text x="525" y="46" class="label title">LangChain layer</text>
  <text x="525" y="66" class="label small">tools · middleware · schemas</text>
  <path d="M608 82V108" class="edge"/>

  <rect x="392" y="111" width="432" height="90" rx="24" fill="url(#green)" filter="url(#shadow)"/>
  <circle cx="444" cy="156" r="28" fill="#fff" opacity=".18"/>
  <circle cx="437" cy="149" r="5" fill="#fff"/><circle cx="453" cy="149" r="5" fill="#fff"/><circle cx="445" cy="166" r="5" fill="#fff"/>
  <path d="M441 151l7 0M440 153l3 9M450 153l-3 9" stroke="#fff" stroke-width="1.8"/>
  <text x="487" y="151" class="label title" fill="#fff">LangGraph runtime</text>
  <text x="487" y="176" class="label small" style="fill:#d8f4ea">state · nodes · edges · threads · checkpoints</text>

  <rect x="75" y="233" width="485" height="216" rx="27" fill="url(#deep)" stroke="#67ad91" stroke-width="1.8"/>
  <rect x="98" y="254" width="132" height="25" rx="12.5" fill="#15916f"/>
  <text x="164" y="272" text-anchor="middle" class="label micro" fill="#fff">OPINIONATED PATH</text>
  <text x="101" y="314" class="label title">Deep Agents</text>
  <text x="101" y="339" class="label small">harness built on the graph foundation</text>

  <rect x="101" y="365" width="198" height="61" rx="14" fill="#fff" stroke="#79b79f"/>
  <text x="122" y="389" class="label body">Subagent tasks</text>
  <text x="122" y="410" class="label small">isolated context + findings</text>
  <rect x="315" y="365" width="218" height="61" rx="14" fill="#fff" stroke="#79b79f"/>
  <text x="336" y="389" class="label body">Native scaffolding</text>
  <text x="336" y="410" class="label small">todos · files · summarization</text>

  <rect x="640" y="233" width="485" height="216" rx="27" fill="url(#graph)" stroke="#6f9fc7" stroke-width="1.8"/>
  <rect x="663" y="254" width="114" height="25" rx="12.5" fill="#1267a5"/>
  <text x="720" y="272" text-anchor="middle" class="label micro" fill="#fff">EXPLICIT PATH</text>
  <text x="666" y="314" class="label title">Custom LangGraph</text>
  <text x="666" y="339" class="label small">application-owned topology and state</text>

  <rect x="666" y="365" width="208" height="61" rx="14" fill="#fff" stroke="#7ca8ca"/>
  <text x="687" y="389" class="label body">Nodes + edges + state</text>
  <text x="687" y="410" class="label small">fan-out · joins · guards</text>
  <rect x="890" y="365" width="208" height="61" rx="14" fill="#fff" stroke="#7ca8ca"/>
  <text x="911" y="389" class="label body">Thread + interrupt</text>
  <text x="911" y="410" class="label small">checkpoint · pause · resume</text>

  <path d="M392 156C319 156 317 230 317 232" class="edge"/>
  <path d="M824 156C882 156 882 230 882 232" class="edge"/>

  <rect x="158" y="472" width="400" height="38" rx="19" fill="#fff" stroke="#b9cbd9"/>
  <circle cx="184" cy="491" r="11" fill="#d56a3c"/>
  <text x="205" y="496" class="label body">langchain-mcp-adapters</text>
  <text x="397" y="496" class="label small">role-scoped tools</text>
  <rect x="642" y="472" width="400" height="38" rx="19" fill="#fff" stroke="#b9cbd9"/>
  <circle cx="668" cy="491" r="11" fill="#416b8d"/>
  <text x="689" y="496" class="label body">Events + OpenInference</text>
  <text x="888" y="496" class="label small">OTel → Phoenix</text>

  <path d="M317 449V470" class="edge"/>
  <path d="M882 449C882 459 761 459 761 470" class="edge"/>
  <path d="M520 449C520 464 740 456 740 470" class="edge"/>
  <path d="M1036 449V470" class="edge"/>

  <rect x="817" y="18" width="308" height="64" rx="19" fill="#fff" stroke="#c6d5e2"/>
  <text x="842" y="45" class="label micro" fill="#60788e">COMPOSABLE BY DESIGN</text>
  <text x="842" y="67" class="label small">adopt LangGraph without Deep Agents</text>
</svg>

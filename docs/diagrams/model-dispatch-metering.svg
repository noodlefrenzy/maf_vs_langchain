<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" fill="#172033" role="img" aria-labelledby="title desc">
  <title id="title">MAF Harness model dispatch metering before and after correction</title>
  <desc id="desc">The old meter wrapped the entire get_response function invocation loop and recorded one call for multiple provider requests. The corrected ChatMiddleware wraps and counts each provider dispatch before it occurs.</desc>
  <defs>
    <linearGradient id="beforeBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5f1"/><stop offset="1" stop-color="#ffebe3"/></linearGradient>
    <linearGradient id="afterBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef9f5"/><stop offset="1" stop-color="#dff3eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17344d" flood-opacity="0.13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63798d"/></marker>
    <style>
      .label { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 21px; font-weight: 700; }
      .big { font-size: 30px; font-weight: 800; }
      .body { font-size: 15px; font-weight: 600; }
      .small { font-size: 13px; fill: #637285; }
      .micro { font-size: 11px; font-weight: 700; letter-spacing: .7px; }
      .edge { fill: none; stroke: #63798d; stroke-width: 2.2; marker-end: url(#arrow); }
      .card { fill: #fff; stroke: #c7d5e1; stroke-width: 1.4; filter: url(#shadow); }
    </style>
  </defs>

  <rect x="18" y="24" width="559" height="452" rx="28" fill="url(#beforeBg)" stroke="#dfa184" stroke-width="1.8"/>
  <rect x="599" y="24" width="583" height="452" rx="28" fill="url(#afterBg)" stroke="#68ae92" stroke-width="1.8"/>

  <rect x="43" y="47" width="96" height="28" rx="14" fill="#c65d36"/>
  <text x="91" y="66" text-anchor="middle" class="label micro" fill="#fff">BEFORE</text>
  <text x="43" y="108" class="label title">One meter around the whole loop</text>
  <text x="43" y="131" class="label small">Public `get_response()` returns aggregated usage</text>

  <rect x="55" y="162" width="486" height="246" rx="22" fill="#fff" stroke="#c65d36" stroke-width="3" stroke-dasharray="9 6"/>
  <rect x="76" y="182" width="157" height="30" rx="15" fill="#fff0e9" stroke="#dc9c7d"/>
  <text x="154" y="202" text-anchor="middle" class="label micro" fill="#a64726">FUNCTION INVOCATION LOOP</text>

  <rect x="82" y="239" width="128" height="61" rx="14" class="card"/>
  <text x="146" y="264" text-anchor="middle" class="label body">Provider #1</text>
  <text x="146" y="283" text-anchor="middle" class="label small">model dispatch</text>
  <path d="M210 270H235" class="edge"/>
  <rect x="238" y="239" width="116" height="61" rx="14" class="card"/>
  <text x="296" y="264" text-anchor="middle" class="label body">Tool call</text>
  <text x="296" y="283" text-anchor="middle" class="label small">inner loop</text>
  <path d="M354 270H379" class="edge"/>
  <rect x="382" y="239" width="128" height="61" rx="14" class="card"/>
  <text x="446" y="264" text-anchor="middle" class="label body">Provider #2</text>
  <text x="446" y="283" text-anchor="middle" class="label small">model dispatch</text>
  <text x="296" y="341" text-anchor="middle" class="label small">…the loop may continue through more tool/model turns…</text>

  <circle cx="118" cy="381" r="26" fill="#c65d36"/>
  <text x="118" y="390" text-anchor="middle" class="label big" fill="#fff">1</text>
  <text x="157" y="377" class="label body">normalized call</text>
  <text x="157" y="397" class="label small">despite multiple wire requests</text>

  <rect x="624" y="47" width="82" height="28" rx="14" fill="#15916f"/>
  <text x="665" y="66" text-anchor="middle" class="label micro" fill="#fff">AFTER</text>
  <text x="624" y="108" class="label title">Middleware at each provider dispatch</text>
  <text x="624" y="131" class="label small">Budget reserved before the request leaves the process</text>

  <rect x="628" y="172" width="526" height="92" rx="18" fill="#fff" stroke="#83bda7" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="649" y="190" width="132" height="56" rx="13" fill="#edf8f4" stroke="#15916f" stroke-width="2.4"/>
  <text x="715" y="214" text-anchor="middle" class="label body">Middleware</text>
  <text x="715" y="233" text-anchor="middle" class="label small">reserve + record</text>
  <path d="M781 218H810" class="edge"/>
  <rect x="813" y="190" width="145" height="56" rx="13" class="card"/>
  <text x="885" y="214" text-anchor="middle" class="label body">Provider #1</text>
  <text x="885" y="233" text-anchor="middle" class="label small">wire request</text>
  <circle cx="1098" cy="218" r="27" fill="#15916f"/>
  <text x="1098" y="227" text-anchor="middle" class="label big" fill="#fff">1</text>

  <rect x="628" y="286" width="526" height="92" rx="18" fill="#fff" stroke="#83bda7" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="649" y="304" width="132" height="56" rx="13" fill="#edf8f4" stroke="#15916f" stroke-width="2.4"/>
  <text x="715" y="328" text-anchor="middle" class="label body">Middleware</text>
  <text x="715" y="347" text-anchor="middle" class="label small">reserve + record</text>
  <path d="M781 332H810" class="edge"/>
  <rect x="813" y="304" width="145" height="56" rx="13" class="card"/>
  <text x="885" y="328" text-anchor="middle" class="label body">Provider #2</text>
  <text x="885" y="347" text-anchor="middle" class="label small">wire request</text>
  <circle cx="1098" cy="332" r="27" fill="#15916f"/>
  <text x="1098" y="341" text-anchor="middle" class="label big" fill="#fff">2</text>

  <rect x="678" y="406" width="425" height="45" rx="22.5" fill="#15916f"/>
  <path d="M706 429l7 7 15-18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="742" y="434" class="label body" fill="#fff">normalized count = native provider dispatches</text>
</svg>

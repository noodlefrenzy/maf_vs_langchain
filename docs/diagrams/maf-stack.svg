<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" fill="#172033" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Agent Framework stack in the experiment</title>
  <desc id="desc">An OpenAI chat client feeds the MAF Agent primitive. The Agent supports an opinionated Harness path with background agents and an explicit Workflows path with typed executors and checkpoints. Both connect to role-scoped MCP and native OpenTelemetry.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1267a5"/><stop offset="1" stop-color="#0b4d80"/></linearGradient>
    <linearGradient id="harness" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f4fc"/><stop offset="1" stop-color="#d8ecfa"/></linearGradient>
    <linearGradient id="workflow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf8f3"/><stop offset="1" stop-color="#d9f0e8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17344d" flood-opacity="0.14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63798d"/></marker>
    <style>
      .label { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 21px; font-weight: 700; }
      .body { font-size: 15px; font-weight: 600; }
      .small { font-size: 13px; fill: #637285; }
      .micro { font-size: 11px; font-weight: 700; letter-spacing: .7px; }
      .edge { fill: none; stroke: #63798d; stroke-width: 2.3; marker-end: url(#arrow); }
      .card { fill: #fff; stroke: #c6d5e2; stroke-width: 1.5; filter: url(#shadow); }
    </style>
  </defs>

  <rect x="430" y="18" width="340" height="64" rx="19" class="card"/>
  <circle cx="469" cy="50" r="18" fill="#7755a6"/>
  <path d="M459 50c6-11 14-11 20 0-6 11-14 11-20 0Z" fill="none" stroke="#fff" stroke-width="1.9"/>
  <text x="500" y="46" class="label title">OpenAI chat client</text>
  <text x="500" y="66" class="label small">local Chat Completions endpoint</text>
  <path d="M600 82V108" class="edge"/>

  <rect x="392" y="111" width="416" height="90" rx="24" fill="url(#blue)" filter="url(#shadow)"/>
  <circle cx="444" cy="156" r="28" fill="#fff" opacity=".18"/>
  <path d="M432 167c2-13 22-13 24 0M444 137a9 9 0 1 0 0 18 9 9 0 0 0 0-18" fill="none" stroke="#fff" stroke-width="2.2"/>
  <text x="487" y="151" class="label title" fill="#fff">MAF Agent primitive</text>
  <text x="487" y="176" class="label small" style="fill:#d9eafa">model · tools · middleware · sessions</text>

  <path d="M516 201V230" class="edge"/>
  <path d="M684 201V230" class="edge"/>

  <rect x="75" y="233" width="485" height="216" rx="27" fill="url(#harness)" stroke="#6fa9d0" stroke-width="1.8"/>
  <rect x="98" y="254" width="132" height="25" rx="12.5" fill="#1267a5"/>
  <text x="164" y="272" text-anchor="middle" class="label micro" fill="#fff">OPINIONATED PATH</text>
  <text x="101" y="314" class="label title">MAF Harness</text>
  <text x="101" y="339" class="label small">long-horizon agent scaffolding</text>

  <rect x="101" y="365" width="198" height="61" rx="14" fill="#fff" stroke="#88b8d8"/>
  <text x="122" y="389" class="label body">Background agents</text>
  <text x="122" y="410" class="label small">parallel specialist delegation</text>
  <rect x="315" y="365" width="218" height="61" rx="14" fill="#fff" stroke="#88b8d8"/>
  <text x="336" y="389" class="label body">Native scaffolding</text>
  <text x="336" y="410" class="label small">files · todos · modes · compaction</text>

  <rect x="640" y="233" width="485" height="216" rx="27" fill="url(#workflow)" stroke="#67ad91" stroke-width="1.8"/>
  <rect x="663" y="254" width="114" height="25" rx="12.5" fill="#15916f"/>
  <text x="720" y="272" text-anchor="middle" class="label micro" fill="#fff">EXPLICIT PATH</text>
  <text x="666" y="314" class="label title">MAF Workflows</text>
  <text x="666" y="339" class="label small">graph-based deterministic orchestration</text>

  <rect x="666" y="365" width="208" height="61" rx="14" fill="#fff" stroke="#7ab89f"/>
  <text x="687" y="389" class="label body">Typed executors + edges</text>
  <text x="687" y="410" class="label small">routing · fan-out · joins</text>
  <rect x="890" y="365" width="208" height="61" rx="14" fill="#fff" stroke="#7ab89f"/>
  <text x="911" y="389" class="label body">Checkpoint + approval</text>
  <text x="911" y="410" class="label small">pause · request · resume</text>

  <path d="M392 156C319 156 317 230 317 232" class="edge"/>
  <path d="M808 156C882 156 882 230 882 232" class="edge"/>

  <rect x="158" y="472" width="400" height="38" rx="19" fill="#fff" stroke="#b9cbd9"/>
  <circle cx="184" cy="491" r="11" fill="#d56a3c"/>
  <text x="205" y="496" class="label body">Role-scoped MCP tools</text>
  <text x="390" y="496" class="label small">shared capability boundary</text>
  <rect x="642" y="472" width="400" height="38" rx="19" fill="#fff" stroke="#b9cbd9"/>
  <circle cx="668" cy="491" r="11" fill="#416b8d"/>
  <text x="689" y="496" class="label body">Native OpenTelemetry</text>
  <text x="879" y="496" class="label small">agents · workflows · MCP</text>

  <path d="M317 449V470" class="edge"/>
  <path d="M882 449C882 459 761 459 761 470" class="edge"/>
  <path d="M520 449C520 464 740 456 740 470" class="edge"/>
  <path d="M1036 449V470" class="edge"/>
</svg>

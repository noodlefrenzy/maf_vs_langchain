<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" fill="#172033" role="img" aria-labelledby="title desc">
  <title id="title">Architecture of the MAF versus LangChain comparison lab</title>
  <desc id="desc">A control plane launches isolated MAF and Lang runners against same-seed world clones. Both use one local model and emit normalized bundles and native traces for deterministic evaluation.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <linearGradient id="pairBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5fb"/>
      <stop offset="1" stop-color="#eef9f5"/>
    </linearGradient>
    <linearGradient id="mafBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e7f2fb"/>
      <stop offset="1" stop-color="#d7eaf8"/>
    </linearGradient>
    <linearGradient id="langBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e8f8f2"/>
      <stop offset="1" stop-color="#d7f0e7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#19324a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64788b"/>
    </marker>
    <style>
      .label { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 21px; font-weight: 700; }
      .body { font-size: 17px; font-weight: 600; }
      .small { font-size: 14px; fill: #607083; }
      .micro { font-size: 12px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; }
      .card { fill: #fff; stroke: #cbd8e5; stroke-width: 1.5; filter: url(#shadow); }
      .edge { fill: none; stroke: #64788b; stroke-width: 2.2; marker-end: url(#arrow); }
      .bidirectional { fill: none; stroke: #64788b; stroke-width: 2.2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .mafEdge { stroke: #1267a5; }
      .langEdge { stroke: #15916f; }
    </style>
  </defs>

  <rect x="270" y="24" width="540" height="522" rx="28" fill="url(#pairBg)" stroke="#b8cadd" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="300" y="59" class="label title">Matched pair</text>
  <rect x="418" y="39" width="214" height="27" rx="13.5" fill="#fff" stroke="#cbd8e5"/>
  <text x="525" y="57" text-anchor="middle" class="label small">same seed · isolated state</text>

  <rect x="26" y="212" width="198" height="112" rx="18" class="card"/>
  <circle cx="66" cy="250" r="19" fill="#173f64"/>
  <path d="M57 250h18M66 241v18" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="96" y="246" class="label title">Control plane</text>
  <text x="96" y="270" class="label small">config · order · budgets</text>
  <text x="96" y="289" class="label small">launch · validate · index</text>

  <rect x="300" y="86" width="480" height="188" rx="22" fill="url(#mafBg)" stroke="#88b8da" stroke-width="1.8"/>
  <rect x="320" y="105" width="104" height="25" rx="12.5" fill="#1267a5"/>
  <text x="372" y="123" text-anchor="middle" class="label micro" fill="#fff">MAF LANE</text>
  <rect x="330" y="153" width="188" height="82" rx="16" fill="#fff" stroke="#79add1" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="365" cy="194" r="20" fill="#1267a5"/>
  <text x="365" y="200" text-anchor="middle" class="label body" fill="#fff">M</text>
  <text x="397" y="190" class="label body">MAF runner</text>
  <text x="397" y="211" class="label small">isolated process</text>
  <path d="M518 194H574" class="bidirectional mafEdge"/>
  <rect x="576" y="147" width="170" height="94" rx="47" fill="#fff" stroke="#79add1" stroke-width="1.5" filter="url(#shadow)"/>
  <ellipse cx="661" cy="172" rx="49" ry="13" fill="#dceefa" stroke="#79add1"/>
  <path d="M612 172v32c0 8 22 14 49 14s49-6 49-14v-32" fill="#edf7fd" stroke="#79add1"/>
  <text x="661" y="198" text-anchor="middle" class="label body">World clone A</text>
  <text x="547" y="183" text-anchor="middle" class="label micro" fill="#1267a5">MCP</text>

  <rect x="300" y="298" width="480" height="188" rx="22" fill="url(#langBg)" stroke="#78bea7" stroke-width="1.8"/>
  <rect x="320" y="317" width="120" height="25" rx="12.5" fill="#15916f"/>
  <text x="380" y="335" text-anchor="middle" class="label micro" fill="#fff">LANG LANE</text>
  <rect x="330" y="365" width="188" height="82" rx="16" fill="#fff" stroke="#6cb99f" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="365" cy="406" r="20" fill="#15916f"/>
  <text x="365" y="412" text-anchor="middle" class="label body" fill="#fff">L</text>
  <text x="397" y="402" class="label body">Lang runner</text>
  <text x="397" y="423" class="label small">isolated process</text>
  <path d="M518 406H574" class="bidirectional langEdge"/>
  <rect x="576" y="359" width="170" height="94" rx="47" fill="#fff" stroke="#6cb99f" stroke-width="1.5" filter="url(#shadow)"/>
  <ellipse cx="661" cy="384" rx="49" ry="13" fill="#d9f2e9" stroke="#6cb99f"/>
  <path d="M612 384v32c0 8 22 14 49 14s49-6 49-14v-32" fill="#edf9f5" stroke="#6cb99f"/>
  <text x="661" y="410" text-anchor="middle" class="label body">World clone B</text>
  <text x="547" y="395" text-anchor="middle" class="label micro" fill="#15916f">MCP</text>

  <path d="M224 251H301" class="edge"/>
  <path d="M224 286C250 286 252 406 301 406" class="edge"/>

  <rect x="850" y="37" width="320" height="96" rx="18" class="card"/>
  <circle cx="891" cy="85" r="21" fill="#7755a6"/>
  <path d="M880 84c7-13 16-13 23 0-7 13-16 13-23 0Z" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="925" y="79" class="label title">Local model</text>
  <text x="925" y="103" class="label small">one OpenAI-compatible endpoint</text>

  <rect x="850" y="163" width="320" height="96" rx="18" class="card"/>
  <circle cx="891" cy="211" r="21" fill="#d47a39"/>
  <path d="M880 211h22M884 204h14M886 218h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="925" y="205" class="label title">Normalized evidence</text>
  <text x="925" y="229" class="label small">events · bundles · provenance</text>

  <rect x="850" y="289" width="320" height="96" rx="18" class="card"/>
  <circle cx="891" cy="337" r="21" fill="#416b8d"/>
  <path d="M880 344l7-13 7 7 9-16" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="925" y="331" class="label title">Native traces</text>
  <text x="925" y="355" class="label small">OTLP → Phoenix + local ledger</text>

  <rect x="850" y="415" width="320" height="96" rx="18" class="card"/>
  <circle cx="891" cy="463" r="21" fill="#173f64"/>
  <path d="M882 463l6 6 12-14" fill="none" stroke="#fff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="925" y="457" class="label title">Deterministic evaluator</text>
  <text x="925" y="481" class="label small">hidden world + audit + artifacts</text>

  <path d="M518 162C645 98 730 85 848 85" class="bidirectional mafEdge"/>
  <path d="M518 382C660 445 733 85 848 85" class="bidirectional langEdge"/>
  <path d="M518 210C690 210 705 211 848 211" class="edge mafEdge"/>
  <path d="M518 424C688 424 705 230 848 220" class="edge langEdge"/>
  <path d="M518 226C670 260 708 337 848 337" class="edge mafEdge"/>
  <path d="M518 440C665 395 714 337 848 337" class="edge langEdge"/>
  <path d="M746 194C803 194 810 463 848 463" class="edge"/>
  <path d="M746 406C790 406 803 463 848 463" class="edge"/>
  <path d="M1010 259V413" class="edge"/>
</svg>

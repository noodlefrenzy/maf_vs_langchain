<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" fill="#172033" role="img" aria-labelledby="title desc">
  <title id="title">Matched opinionated harness architecture</title>
  <desc id="desc">A native coordinator uses planning and context features to delegate to three specialists, while framework-neutral budgets, evidence provenance, approval, mitigation, and recovery remain outside the harness.</desc>
  <defs>
    <linearGradient id="nativeBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef5fb"/><stop offset="1" stop-color="#ecf8f4"/></linearGradient>
    <linearGradient id="guardBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8ef"/><stop offset="1" stop-color="#fff1e7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#19324a" flood-opacity="0.13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#61778b"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d56a3c"/></marker>
    <style>
      .label { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 19px; font-weight: 700; }
      .body { font-size: 15px; font-weight: 600; }
      .small { font-size: 13px; fill: #637285; }
      .micro { font-size: 11px; font-weight: 700; letter-spacing: .7px; }
      .card { fill: #fff; stroke: #c9d7e4; stroke-width: 1.5; filter: url(#shadow); }
      .edge { fill: none; stroke: #61778b; stroke-width: 2.2; marker-end: url(#arrow); }
      .bi { fill: none; stroke: #61778b; stroke-width: 2.2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .control { fill: none; stroke: #d56a3c; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#orangeArrow); }
    </style>
  </defs>

  <rect x="18" y="56" width="828" height="458" rx="30" fill="url(#nativeBg)" stroke="#a9c6da" stroke-width="1.8"/>
  <text x="45" y="88" class="label micro" fill="#1267a5">NATIVE HARNESS BEHAVIOR · THE PRODUCT UNDER TEST</text>
  <rect x="866" y="56" width="316" height="458" rx="30" fill="url(#guardBg)" stroke="#dfaf8e" stroke-width="1.8"/>
  <text x="891" y="88" class="label micro" fill="#b75431">FRAMEWORK-NEUTRAL SAFETY BOUNDARY</text>

  <rect x="250" y="14" width="360" height="64" rx="18" fill="#173f64" filter="url(#shadow)"/>
  <circle cx="286" cy="46" r="17" fill="#fff" opacity=".18"/>
  <path d="M278 46h16M286 38v16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="316" y="42" class="label title" fill="#fff">Incident objective</text>
  <text x="316" y="62" class="label small" style="fill:#d9e8f5">same brief · roles · model · tools</text>

  <path d="M430 78V133" class="edge"/>
  <rect x="276" y="136" width="308" height="112" rx="24" fill="#fff" stroke="#789db9" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="327" cy="192" r="30" fill="#173f64"/>
  <path d="M313 206c3-14 25-14 28 0M327 171a10 10 0 1 0 0 20 10 10 0 0 0 0-20" fill="none" stroke="#fff" stroke-width="2.2"/>
  <text x="372" y="181" class="label title">Native coordinator</text>
  <text x="372" y="204" class="label small">chooses when, whom, and what context</text>
  <rect x="371" y="214" width="90" height="21" rx="10.5" fill="#e8f3fb"/>
  <text x="416" y="229" text-anchor="middle" class="label micro" fill="#1267a5">DELEGATION</text>
  <rect x="467" y="214" width="96" height="21" rx="10.5" fill="#e9f7f2"/>
  <text x="515" y="229" text-anchor="middle" class="label micro" fill="#15916f">SYNTHESIS</text>

  <rect x="45" y="125" width="176" height="138" rx="20" fill="#fff" stroke="#a8bfd1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="67" y="154" class="label micro" fill="#60788e">NATIVE SCAFFOLDING</text>
  <text x="67" y="184" class="label body">✓ planning / todos</text>
  <text x="67" y="207" class="label body">✓ context + compaction</text>
  <text x="67" y="230" class="label body">✓ files / workspace</text>
  <text x="67" y="253" class="label body">✓ scheduling</text>
  <path d="M221 194H274" class="edge" stroke-dasharray="6 5"/>

  <path d="M342 248C300 276 227 296 194 326" class="bi"/>
  <path d="M430 248V315" class="bi"/>
  <path d="M518 248C560 276 633 296 666 326" class="bi"/>

  <rect x="85" y="328" width="224" height="116" rx="20" fill="#e8f3fb" stroke="#6ea5cc" stroke-width="1.6" filter="url(#shadow)"/>
  <circle cx="124" cy="367" r="20" fill="#1267a5"/>
  <path d="M114 374l6-11 6 6 9-15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="155" y="360" class="label title">Telemetry</text>
  <text x="155" y="382" class="label small">role-scoped MCP</text>
  <text x="109" y="417" class="label small">isolated context → finding</text>

  <rect x="318" y="328" width="224" height="116" rx="20" fill="#e9f7f2" stroke="#6ab397" stroke-width="1.6" filter="url(#shadow)"/>
  <circle cx="357" cy="367" r="20" fill="#15916f"/>
  <path d="M347 360h20M347 367h14M347 374h17" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="388" y="360" class="label title">Changes</text>
  <text x="388" y="382" class="label small">role-scoped MCP</text>
  <text x="342" y="417" class="label small">isolated context → finding</text>

  <rect x="551" y="328" width="224" height="116" rx="20" fill="#fff4ec" stroke="#d79770" stroke-width="1.6" filter="url(#shadow)"/>
  <circle cx="590" cy="367" r="20" fill="#d56a3c"/>
  <path d="M580 367l7 7 14-17" fill="none" stroke="#fff" stroke-width="2.2"/>
  <text x="621" y="360" class="label title">Reliability</text>
  <text x="621" y="382" class="label small">role-scoped MCP</text>
  <text x="575" y="417" class="label small">isolated context → finding</text>

  <path d="M584 192C700 192 765 204 864 204" class="control"/>
  <rect x="891" y="118" width="266" height="72" rx="16" class="card"/>
  <text x="916" y="148" class="label title">Dispatch-time budgets</text>
  <text x="916" y="171" class="label small">model · tools · tokens · time</text>
  <path d="M1024 190V213" class="edge"/>

  <path d="M775 386C820 386 832 256 889 256" class="control"/>
  <rect x="891" y="216" width="266" height="78" rx="16" class="card"/>
  <text x="916" y="246" class="label title">Evidence gate</text>
  <text x="916" y="269" class="label small">real MCP calls · exact IDs · roles</text>
  <path d="M1024 294V317" class="edge"/>

  <rect x="891" y="320" width="266" height="72" rx="16" class="card"/>
  <circle cx="920" cy="356" r="15" fill="#173f64"/>
  <path d="M914 356l4 4 8-10" fill="none" stroke="#fff" stroke-width="1.8"/>
  <text x="947" y="351" class="label title">Approval</text>
  <text x="947" y="373" class="label small">action-bound, ephemeral token</text>
  <path d="M1024 392V415" class="edge"/>

  <rect x="891" y="418" width="266" height="72" rx="16" fill="#edf8f4" stroke="#6ab397" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="916" y="448" class="label title">Mitigate → verify</text>
  <text x="916" y="471" class="label small">deterministic world + evaluator</text>

  <rect x="294" y="468" width="272" height="30" rx="15" fill="#fff" stroke="#bbcad8"/>
  <text x="430" y="488" text-anchor="middle" class="label micro">BUILT-IN DIFFERENCES REMAIN VISIBLE</text>
</svg>

services:
  phoenix:
    image: arizephoenix/phoenix:version-19.10.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6006:6006"
      - "127.0.0.1:4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
    volumes:
      - ./data:/data

schema_version = "0.1.0"
experiment_id = "explicit_workflow_tracing_disabled_smoke"
scenario = "incident_response"
lanes = ["maf_workflow", "langgraph"]
seeds = [42]
repetitions = 1
order = "alternating"
model_profile = "configs/models/qwen3_next_80b_lonestar_llamacpp.toml"
fault_profile = "none"
approval_policy = "scripted"
capture_sensitive = false
capture_reasoning = false

[inference_runtime]
server_kind = "llama_cpp"
host = "lonestar"
compute_backend = "vulkan"
process_name = "llama-server"
command_timeout_seconds = 10

[tracing]
enabled = false
collector_endpoint = "http://127.0.0.1:6006/v1/traces"
phoenix_base_url = "http://127.0.0.1:6006"
exporter_timeout_seconds = 1.0

[resource_metrics]
enabled = true
interval_seconds = 0.5
server_state = "warm"
prefix_cache_state = "enabled_uncontrolled"

[budget]
wall_clock_seconds = 600
model_calls = 24
tool_calls = 48
output_tokens = 24000
approval_requests = 1
